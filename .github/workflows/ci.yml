name: ci

on:
  push:
    branches: [main]
  pull_request:

# WHY: the pinned build environment of `xtask::PINNED_ENV`, so every step builds exactly like
# `cargo xtask dev-check` on a laptop. CARGO_INCREMENTAL=0 (common on runners) makes the
# coverage report "functions with mismatched data" and fail the 100 % gate; machine-wide
# RUSTFLAGS would change what is compiled. `xtask/tests/workflows.rs` keeps the two in step.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  RUSTFLAGS: ""

jobs:
  dev-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml (the single place naming the compiler,
      # the components and the targets), like the Docker image installs it.
      - name: Install the toolchain
        run: rustup toolchain install

      # WHY: the whole gate is `cargo xtask dev-check` — fmt, clippy, tests, then the
      # coverage ratchet. `tests/render.rs` boots the real app headlessly and its SSR test
      # renders through wgpu on a software rasterizer, which needs mesa's Vulkan and GL
      # drivers present: llvmpipe (Vulkan) and lavapipe/swrast (GL) let `server_app` find
      # an adapter on a runner with no GPU — the test skips loudly, not silently, when
      # they are missing, so they never are on CI.
      - name: Install the software rasterizers (mesa) and the native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers libgl1-mesa-dri

      - name: Show the adapter the renderer will find
        run: vulkaninfo --summary 2>/dev/null | head -12 || true

      # WHY: `dev-check` ends with `cargo xtask coverage`, which shells out to `cargo llvm-cov`;
      # the runner image does not ship it (the llvm-tools component comes from the toolchain file).
      - name: Install the coverage tool
        run: cargo install --locked cargo-llvm-cov

      - name: dev-check (fmt, clippy, tests, 100 % coverage)
        run: cargo xtask dev-check

      - name: The engine feature builds without the default one
        run: cargo test -p srr --no-default-features

      # WHY: the cel-shaded 3D fighters live behind the `mode3d` feature so the 2D build stays
      # the default. The render tests then boot the 3D view with the committed cube-man
      # fixture (assets/models/chalk) and assert the toon material and the AnimationPlayer —
      # no Meshy download, no GPU beyond mesa.
      - name: The 3D fighters (mode3d) lint and render headlessly
        run: |
          cargo clippy -p srr --all-targets --features mode3d -- -D warnings
          cargo test -p srr --features mode3d --test render --test models

      - name: The committed 3D models pass their audit
        run: cargo xtask models
